name: Release Test
run-name: >
  Release by => ${{ github.actor }} || 
  Release Title: ${{ github.event.release.name }} || 
  Release Tag: ${{ github.event.release.tag_name }}


on:
  release:
    types: [published]

env:
  RED_COLOR_MESSAGE: "\e[31m"
  GREEN_COLOR_MESSAGE: "\e[32m"
  YELLOW_COLOR_MESSAGE: "\e[33m"


jobs:
  env-select:
    name: ENV Selection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Resolve environment
        run: |
          printf "\n\n =======================================================================\n"
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.action }}" == "published" ]]; then
            echo "ENV=Production" >> $GITHUB_ENV
          else
            echo "ENV=Unknown" >> $GITHUB_ENV
          fi  

      - name: Displaying Output
        run: |
          echo "Selected Environment =>  ${{ env.GREEN_COLOR_MESSAGE }} ${{ env.ENV }} ${{ env.RESET_COLOR_MESSAGE }}"
          
    outputs:
      ENV: ${{ env.ENV }}

  build-and-deploy:
    name:  Backend (Build + Deploy) => ${{ needs.env-select.outputs.ENV }}
    strategy:
      matrix:
        node-version: [22.6]
        npm-version: [10.8]
    runs-on: ubuntu-latest
    needs: [env-select]
    environment: ${{ needs.env-select.outputs.ENV }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

        